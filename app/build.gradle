plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.williamnb.readlistenapp"
        namespace 'com.williamnb.readlistenapp'
        minSdk 26
        targetSdk 33
        multiDexEnabled true
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
}

ext {
    lifecycle_version = '2.9.2'
    nav_version = '2.9.3'
    rx_java2_version = '2.2.20'
    rx_android2_version = '2.1.1'
    picasso_version = '2.71828'
    retrofit_version = '3.0.0'
    okhttp3_version = '4.7.2'
}

dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.0.0')

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    // Navigation component
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    // Testing Navigation
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    // dimens
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    // lib use in tvShows
//    implementation 'com.wang.avi:library:2.1.3'
    implementation 'io.michaelrocks:libphonenumber-android:9.0.5'

    //readMore lib
    implementation 'kr.co.prnd:readmore-textview:1.0.0'

    //cardView
    implementation 'androidx.cardview:cardview: 1.0.0'

    //Rx
    implementation "io.reactivex.rxjava2:rxjava:$rx_java2_version"
    implementation "io.reactivex.rxjava2:rxandroid:$rx_android2_version"
//    implementation "com.tbruyelle.rxpermissions2:rxpermissions:0.9.4"
    implementation 'io.github.mayampi01:com.tbruyelle.rxpermissions2:0.9.5'

    //Room & RxJava Support
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.room:room-rxjava2:2.7.2'

    //Picasso
    implementation "com.squareup.picasso:picasso:$picasso_version"

    //Retrofit
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp3_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp3_version"

    //viewPager2
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    //indicator3
    implementation 'me.relex:circleindicator:2.1.6'

    //RoundedImageView
    implementation 'com.makeramen:roundedimageview:2.3.0'
    //CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    //Firebase
    implementation 'com.google.firebase:firebase-messaging:25.0.0'
    implementation 'com.google.firebase:firebase-firestore:26.0.0'

    //neumorphism
    implementation 'com.github.fornewid:neumorphism:0.3.2'

    //MultiDex
    implementation "androidx.multidex:multidex:2.0.1"

    //appcompat
    implementation 'androidx.appcompat:appcompat:1.7.1'

    //material design
    implementation 'com.google.android.material:material:1.12.0'

    //unit test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}